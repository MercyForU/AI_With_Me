// Top-level build file where you can add configuration options common to all sub-projects/modules.

// 国内网络下 dl.google.com 只有几 KB/s，AGP 依赖会大面积超时。
// 这里把 google() / mavenCentral() 前置为阿里云镜像（内容一致），官方源保留兜底。
// 注意：buildscript 块先于脚本主体求值，所以列表必须内联，不能引用外部变量。

buildscript {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }
}

// AGP 8.13 默认要求 build-tools 35.0.0，但本机只装了 36.0.0（35 的包在国内镜像上取不完整）。
// 36 与 compileSdk 36 完全兼容，这里统一指过去，避免为了一个构建工具版本再拉 60MB。
subprojects {
    afterEvaluate { p ->
        if (p.plugins.hasPlugin('com.android.application') || p.plugins.hasPlugin('com.android.library')) {
            p.android.buildToolsVersion = '36.0.0'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
